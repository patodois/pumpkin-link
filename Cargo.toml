[package]
name = "pumpkin-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Pumpkin server plugin that speaks the rewrite-bridge passthrough link protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patodois/pumpkin-link"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
# The glue to Pumpkin's plugin API (WebAssembly targets only).
plugin = ["dep:pumpkin-plugin-api", "dep:tracing"]

[dependencies]
rewrite-bridge = { version = "=0.3.0", features = ["link"] }
serde_json = "1"
pumpkin-plugin-api = { version = "=0.2.1", optional = true }
tracing = { version = "0.1", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
